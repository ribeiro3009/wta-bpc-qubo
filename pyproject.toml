[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wta-bpc"
version = "0.1.0"
description = "Branch-and-price for static Weapon-Target Assignment, with a QUBO version of the primal heuristic (step 2.5)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "highspy",
]

[project.optional-dependencies]
dev = ["pytest"]
# quantum = ["qiskit"]  # added in step 4 (QAOA solver)

[tool.hatch.build.targets.wheel]
packages = ["src/wta_bpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
